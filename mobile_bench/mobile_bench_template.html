<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AgriFilter 端侧推理基准</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2b3440; --fg:#e6edf3; --dim:#8b949e;
    --acc:#3fb950; --acc2:#58a6ff; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
       padding:18px 16px 60px}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px;word-break:break-all}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:14px 14px;margin-bottom:13px}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
  .row span:first-child{color:var(--dim)}
  .k{font-variant-numeric:tabular-nums}
  button{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;
         color:#06240f;background:var(--acc);margin-top:6px}
  button:disabled{opacity:.45}
  button.sec{background:#21262d;color:var(--fg);border:1px solid var(--line)}
  .bar{height:4px;border-radius:2px;background:#21262d;overflow:hidden;margin:10px 0 2px}
  .bar>i{display:block;height:100%;width:0;background:var(--acc2);transition:width .25s}
  #log{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);
       white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px}
  pre#out{margin:0;font:12px/1.5 ui-monospace,Consolas,monospace;color:#c9d1d9;
          white-space:pre-wrap;word-break:break-all}
  .hide{display:none}
</style>
</head>
<body>

<h1>AgriFilter 端侧推理基准</h1>
<div class="sub" id="ua">初始化中…</div>

<div class="card">
  <div class="row"><span>运行环境</span><span id="env" class="k">—</span></div>
  <div class="row"><span>模型大小 (SAF / CSC)</span><span id="msz" class="k">—</span></div>
  <div class="row"><span>推理次数</span><span id="nrun" class="k">预热 10 / 计时 200</span></div>
  <div class="bar"><i id="prog"></i></div>
</div>

<button id="go">开始测试</button>

<div class="card hide" id="resCard">
  <table>
    <thead><tr><th>模型 / 后端</th><th>均值</th><th>P50</th><th>P95</th><th>Min</th></tr></thead>
    <tbody id="resBody"></tbody>
  </table>
  <div class="row" style="margin-top:8px"><span>边缘本地段合计 (SAF+CSC)</span><span id="e2e" class="k">—</span></div>
  <div class="row"><span>JS 堆占用 (参考)</span><span id="mem" class="k">—</span></div>
</div>

<div class="card hide" id="batCard">
  <div class="row"><span>连续推理 60 s 耗电 (参考)</span><span id="bat" class="k">—</span></div>
</div>

<div class="card">
  <div style="color:var(--dim);font-size:12px;margin-bottom:6px">运行日志</div>
  <div id="log"></div>
</div>

<button id="copy" class="sec hide">复制结果文本</button>
<div class="card hide" id="outCard"><pre id="out"></pre></div>

<!-- ==== 模型（base64 内联，无需额外传输模型文件） ==== -->
<script type="text/plain" id="safB64">__SAF_B64__</script>
<script type="text/plain" id="cscB64">__CSC_B64__</script>
<script type="text/plain" id="metaJson">__META_JSON__</script>

<!-- ==== 推理运行时（内联，完全不依赖 CDN） ==== -->
<script>__ORT_JS__</script>
<script type="text/plain" id="ortMjsB64">__ORT_MJS_B64__</script>
<script type="text/plain" id="ortWasmB64">__ORT_WASM_B64__</script>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(s){ logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function setProg(p){ $('prog').style.width = (p*100).toFixed(0) + '%'; }

const META = JSON.parse($('metaJson').textContent);
$('ua').textContent = navigator.userAgent;
$('env').textContent = META.env_label;
$('msz').textContent = fmtBytes(META.saf_bytes) + ' / ' + fmtBytes(META.csc_bytes);

function fmtBytes(n){ return (n/1048576).toFixed(2) + ' MB'; }
function b64ToU8(b64){
  const bin = atob(b64.trim());
  const u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function stats(a){
  const s = [...a].sort((x,y)=>x-y);
  const q = p => s[Math.min(s.length-1, Math.floor(p*(s.length-1)))];
  return {mean: a.reduce((x,y)=>x+y,0)/a.length, p50:q(.5), p95:q(.95), min:s[0]};
}

function initOrt(){
  if (typeof ort === 'undefined') throw new Error('onnxruntime-web 未加载');
  const mjsUrl = URL.createObjectURL(
    new Blob([b64ToU8($('ortMjsB64').textContent)], {type:'text/javascript'}));
  const wasmUrl = URL.createObjectURL(
    new Blob([b64ToU8($('ortWasmB64').textContent)], {type:'application/wasm'}));
  ort.env.wasm.wasmPaths = {mjs: mjsUrl, wasm: wasmUrl};
  ort.env.wasm.numThreads = 1;
  ort.env.logLevel = 'error';
  log('onnxruntime-web 就绪（内置运行时），版本 ' + (ort.env.versions ? ort.env.versions.web : '?'));
}

const N = 1*3*224*224;
function makeInput(){
  const arr = new Float32Array(N);
  let seed = 12345;
  for (let i=0;i<N;i++){ seed = (seed*1103515245 + 12345) & 0x7fffffff; arr[i] = (seed % 255); }
  return arr;
}

async function benchModel(b64, name, provider){
  const bytes = b64ToU8(b64);
  log(`${name}: 模型 ${fmtBytes(bytes.length)}，后端 ${provider}，编译中…`);
  const sess = await ort.InferenceSession.create(bytes, {executionProviders:[provider]});
  const feed = {};
  feed[sess.inputNames[0]] = new ort.Tensor('float32', makeInput(), [1,3,224,224]);

  for (let i=0;i<10;i++) await sess.run(feed);

  const times = [];
  for (let i=0;i<200;i++){
    const t0 = performance.now();
    await sess.run(feed);
    times.push(performance.now() - t0);
    if (i % 50 === 0) log(`${name}[${provider}] ${i}/200`);
  }
  const st = stats(times);
  log(`${name}[${provider}] 均值 ${st.mean.toFixed(2)} ms / P95 ${st.p95.toFixed(2)} ms`);
  return {name, provider, ...st, bytes: bytes.length, sess, feed};
}

async function runAll(){
  $('go').disabled = true;
  $('go').textContent = '测试中…';
  try {
    initOrt();
    const safB64 = $('safB64').textContent;
    const cscB64 = $('cscB64').textContent;

    const rows = [];
    setProg(0.1);
    rows.push(await benchModel(safB64, 'SAF', 'wasm'));
    setProg(0.45);
    rows.push(await benchModel(cscB64, 'CSC', 'wasm'));
    setProg(0.8);

    const body = $('resBody'); body.innerHTML = '';
    for (const r of rows){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.name} / ${r.provider}</td>
        <td>${r.mean.toFixed(1)}</td><td>${r.p50.toFixed(1)}</td>
        <td>${r.p95.toFixed(1)}</td><td>${r.min.toFixed(1)}</td>`;
      body.appendChild(tr);
    }
    const wSaf = rows.find(r=>r.name==='SAF'&&r.provider==='wasm');
    const wCsc = rows.find(r=>r.name==='CSC'&&r.provider==='wasm');
    const e2e = wSaf.mean + wCsc.mean;
    $('e2e').textContent = e2e.toFixed(1) + ' ms';
    $('resCard').classList.remove('hide');

    if (performance.memory){
      $('mem').textContent = fmtBytes(performance.memory.usedJSHeapSize);
    }
    setProg(0.92);

    // 能耗参考：SAF+CSC 连续推理 60 s
    try {
      if (navigator.getBattery){
        $('batCard').classList.remove('hide');
        const b = await navigator.getBattery();
        const l0 = b.level, t0 = performance.now();
        let k = 0;
        while ((performance.now() - t0) < 60000){
          await wSaf.sess.run(wSaf.feed);
          await wCsc.sess.run(wCsc.feed);
          k++;
        }
        const dur = (performance.now() - t0) / 1000;
        const l1 = b.level, d = (l0 - l1) * 100;
        $('bat').textContent =
          `${dur.toFixed(0)} s 内完成 ${k} 次(SAF+CSC)，电量 ${(l0*100).toFixed(0)}% → ${(l1*100).toFixed(0)}%` +
          (d > 0 ? `（下降 ${d.toFixed(1)} 个百分点）` : '（变化低于系统统计粒度）');
        window.__battery = {dur, k, l0, l1};
      } else {
        $('bat').textContent = '本浏览器不支持 Battery Status API，未测';
      }
    } catch(e){ $('bat').textContent = '读取电量失败: ' + e.message; }

    const lines = [];
    lines.push('=== AgriFilter 端侧基准 ===');
    lines.push('时间: ' + new Date().toISOString());
    lines.push('UA: ' + navigator.userAgent);
    lines.push('硬件并发: ' + (navigator.hardwareConcurrency || '?'));
    lines.push(`模型大小: SAF ${fmtBytes(META.saf_bytes)} / CSC ${fmtBytes(META.csc_bytes)}`);
    lines.push('每模型 预热10 + 计时200 次，单位 ms');
    for (const r of rows){
      lines.push(`${r.name}\t${r.provider}\tmean=${r.mean.toFixed(2)}\tp50=${r.p50.toFixed(2)}\tp95=${r.p95.toFixed(2)}\tmin=${r.min.toFixed(2)}`);
    }
    lines.push(`边缘本地段合计(SAF+CSC, wasm, mean) = ${e2e.toFixed(2)} ms`);
    if (performance.memory) lines.push(`JS 堆 used = ${fmtBytes(performance.memory.usedJSHeapSize)}`);
    if (window.__battery){
      const bb = window.__battery;
      lines.push(`能耗参考: ${bb.dur.toFixed(0)} s 连续 ${bb.k} 次(SAF+CSC)，电量 ${(bb.l0*100).toFixed(0)}% → ${(bb.l1*100).toFixed(0)}%`);
    }
    $('out').textContent = lines.join('\n');
    $('outCard').classList.remove('hide');
    $('copy').classList.remove('hide');
    setProg(1);
    log('全部完成。');
    $('go').textContent = '重新测试';
  } catch(e){
    log('❌ 失败: ' + (e && e.message ? e.message : e));
    console.error(e);
    $('go').textContent = '重试';
  } finally {
    $('go').disabled = false;
  }
}

$('go').onclick = runAll;
$('copy').onclick = async () => {
  const t = $('out').textContent;
  try { await navigator.clipboard.writeText(t); $('copy').textContent = '已复制 ✓'; }
  catch(e){ $('copy').textContent = '复制失败，请手动截屏'; }
  setTimeout(()=>{ $('copy').textContent = '复制结果文本'; }, 2200);
};
</script>
</body>
</html>
